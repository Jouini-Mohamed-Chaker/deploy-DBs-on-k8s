# Minimal lab values for the cockroachdb/cockroachdb chart.
# Insecure mode (no TLS/certs) to keep setup simple - fine for a lab,
# NOT for anything internet-facing or production.

statefulset:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1.5Gi
    limits:
      cpu: "1"
      memory: 2Gi

conf:
  # insecure = skips generating/rotating certs entirely
  insecure: true
  cache: "25%"
  max-sql-memory: "25%"

storage:
  persistentVolume:
    size: 10Gi
    storageClass: local-path   # k3s ships local-path-provisioner by default

# NOTE: with only 2 nodes total (1 control + 1 worker), 3 CockroachDB
# pods cannot each land on a separate node. If topologySpread below
# causes a pod to get stuck Pending (strict spread requiring 3 nodes),
# set topologySpread.enabled to false so the scheduler just packs them
# wherever there's room across the 2 available nodes.
tls:
  enabled: false

topologySpread:
  enabled: false

networkPolicy:
  enabled: false