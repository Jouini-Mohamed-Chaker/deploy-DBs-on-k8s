# Minimal lab values for the vm/victoria-metrics-single chart.
# Single node is intentional - VictoriaMetrics does support a
# distributed "cluster" chart, but it's unnecessary overhead for
# a 3-4 node lab.

server:
  retentionPeriod: "1"   # months of retention, keep short for a lab
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP   # expose later via MetalLB LoadBalancer Service if you want external access