# EDIT the addresses range below to a block of IPs on your VM's LAN
# that are NOT used by DHCP or any other host. Even a range of 5-10
# addresses is plenty for this lab.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250   # <-- EDIT THIS
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool